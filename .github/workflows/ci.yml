name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

env:
  NODE_ENV: test
  # No PORT: the zod schema defaults it to 3000 (see .env's comment on why
  # it's deliberately absent here too).
  # Throwaway CI-only Postgres — not the free-tier Neon DB used for local dev
  # (see .env.example) or production.
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lavenet_ci
  DIRECT_URL: postgresql://postgres:postgres@localhost:5432/lavenet_ci
  # CI-only, not real secrets — safe to commit, never used outside this job.
  JWT_ACCESS_SECRET: 9c2bb7136a1a6c2f3594573708067171d2bc0c18e53aadc0d9c1b4b9df97f3bf
  JWT_REFRESH_SECRET: 7e546bf4ad1f9b9d7a49a4add89f727314a03037df4083fc5bcbec52130e314f
  PAYMENT_WEBHOOK_SECRET: 3a1d9e6f8c2b5047a9e3d6c1f4b8072e5d9a3c6f1b4e8072d5a9c3f6e1b4d807
  CORS_ORIGIN: http://localhost:4200

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lavenet_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: nx-set-shas and `nx affected` need it to diff
          # against the last successful run on main.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: nrwl/nx-set-shas@v5

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Apply migrations to the CI database
        run: pnpm exec prisma migrate deploy

      # Catches a migration that's missing or doesn't match schema.prisma
      # -- exactly the class of bug that otherwise only surfaces in
      # production (P2022, a column schema.prisma expects but no committed
      # migration ever created). `migrate deploy` above only applies what's
      # committed; it doesn't know what schema.prisma expects on top of
      # that, which is what this step checks instead.
      - name: Check schema.prisma matches the migrations directory
        run: pnpm db:check-drift

      - name: Typecheck
        run: pnpm exec nx affected -t typecheck

      - name: Lint
        run: pnpm exec nx affected -t lint

      # Not an nx target (it also `git diff`s generated output) — the
      # contract-first check: fails if the OpenAPI spec apps/api actually
      # exposes has drifted from the committed Angular client.
      - name: Verify generated API client matches the exposed contract
        run: pnpm api:client:check

      - name: Build
        run: pnpm exec nx affected -t build

      # verify:og-tags always reads dist/apps/web/browser, but the step
      # above only builds web when nx affected decides it changed -- an
      # api-only diff (e.g. the AuthRepository refactor, run #24) skips it
      # entirely, leaving no dist and failing this check for a reason that
      # has nothing to do with Open Graph tags. Build web unconditionally;
      # nx's build cache makes this a no-op if affected already built it.
      - name: Build web (dist required by the OG tag check below)
        run: pnpm exec nx build web

      # Crawlers (WhatsApp, Facebook, ...) never execute JS -- they only
      # ever see the static HTML `ng build` prerendered. This catches a tag
      # being set at runtime only, or a relative (non-absolute) URL, which
      # a TestBed-level Meta/Title assertion can't: it only proves Angular's
      # model is correct, not that it landed in the file a crawler fetches.
      - name: Verify Open Graph tags in the prerendered HTML
        run: pnpm verify:og-tags

      - name: Test
        run: pnpm exec nx affected -t test

      # CLAUDE.md §7 : 3 parcours Playwright de bout en bout (inscription +
      # OTP, commande complète jusqu'au paiement, changement de statut par
      # un admin), aucun mock du mécanisme testé. `pnpm db:seed` seul
      # fournit tout ce dont ils dépendent -- comptes de démo (dont
      # admin@lavenet.ci), catalogue, agence, créneaux, commandes de démo
      # (dont LN-DEMO-024) -- sur la base Postgres jetable de ce job,
      # forcément vide à ce stade puisque rien avant ce step n'y écrit.
      - name: Seed demo data for e2e
        run: pnpm db:seed

      # Chromium seulement : c'est le seul navigateur installé et validé en
      # local pendant l'écriture de ces parcours (firefox/webkit n'ont
      # jamais été exercés) -- pas la peine d'alourdir le job avec des
      # navigateurs jamais réellement testés contre l'app.
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # Démarré ici en arrière-plan, séparément du serveur web : la config
      # Playwright (apps/web-e2e/playwright.config.mts) ne pilote que
      # `web:serve`, pas l'API. `api:serve` (mode développement, pas un
      # build de production) reste exactement ce qui a été validé en local.
      - name: Start API server in the background
        run: nohup pnpm exec nx run api:serve > /tmp/api-serve.log 2>&1 &

      - name: Wait for the API server to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/docs -o /dev/null; then
              echo "API is up."
              exit 0
            fi
            sleep 2
          done
          echo "API did not become ready within 120s -- server log:" >&2
          cat /tmp/api-serve.log
          exit 1

      # web:serve reste en configuration `development` par défaut (voir
      # apps/web/project.json) : environment.ts pointe vers
      # localhost:3000, jamais l'API de production -- contrairement à
      # `nx build web` (utilisé plus haut pour le check OG tags), dont la
      # configuration par défaut est `production` et bascule sur
      # environment.prod.ts (l'API Render réelle). Playwright démarre ce
      # serveur lui-même (reuseExistingServer: true dans sa config) ; pas
      # besoin de le lancer ici. --workers=1 : délibéré, pas juste plus
      # lent -- une seule commande d'inscription passe le rate-limit
      # (5/60s) mais l'ordre d'exécution des 3 parcours partage la même
      # base fraîche, et les exécuter en série reproduit exactement ce qui
      # a été validé en local plutôt que d'introduire une concurrence
      # jamais exercée (réservation de créneau notamment).
      - name: Run Playwright e2e (CLAUDE.md §7)
        run: pnpm exec playwright test --config apps/web-e2e/playwright.config.mts --project=chromium --workers=1

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: dist/.playwright/apps/web-e2e/playwright-report
          retention-days: 7
