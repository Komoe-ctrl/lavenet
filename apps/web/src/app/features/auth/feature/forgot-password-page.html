<app-site-header />

<main class="forgot-password-page">
  <h1>Mot de passe oublié</h1>
  <p class="lede">
    Indiquez votre email ou votre téléphone. Si un compte existe, un code vous sera envoyé pour
    réinitialiser votre mot de passe.
  </p>

  <form (submit)="submit($event)" novalidate>
    <div class="field">
      <label for="forgot-password-identifier">Email ou téléphone</label>
      <input
        id="forgot-password-identifier"
        name="identifier"
        type="text"
        autocomplete="username"
        required
        [value]="identifier()"
        (input)="identifier.set($any($event.target).value)"
      />
    </div>

    @if (error()) {
      <p class="field-error" role="alert">{{ error() }}</p>
    }

    <button type="submit" class="submit" [disabled]="submitting()">
      {{ submitting() ? 'Envoi…' : 'Envoyer le code' }}
    </button>
  </form>

  <p class="login-link"><a routerLink="/login">Retour à la connexion</a></p>
</main>

<app-site-footer />
