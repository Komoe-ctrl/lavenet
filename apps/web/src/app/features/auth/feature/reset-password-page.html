<app-site-header />

<main class="reset-password-page">
  <h1>Réinitialiser le mot de passe</h1>
  <p class="lede">Saisissez le code reçu et votre nouveau mot de passe.</p>

  @if (demoOtpCode(); as demoCode) {
    <div class="demo-panel">
      <p class="demo-panel__title">Mode démonstration</p>
      <p class="demo-panel__text">
        Aucun message réel n'est envoyé. Votre code : <code>{{ demoCode }}</code>
      </p>
      <button type="button" (click)="fillDemoCode()">Remplir</button>
    </div>
  }

  <form (submit)="submit($event)" novalidate>
    <div class="field">
      <label for="reset-password-identifier">Email ou téléphone</label>
      <input
        id="reset-password-identifier"
        name="identifier"
        type="text"
        autocomplete="username"
        required
        [value]="identifier()"
        (input)="identifier.set($any($event.target).value)"
      />
    </div>

    <div class="field">
      <label for="reset-password-code">Code reçu</label>
      <input
        id="reset-password-code"
        name="code"
        type="text"
        inputmode="numeric"
        autocomplete="one-time-code"
        pattern="\d{6}"
        maxlength="6"
        required
        [value]="code()"
        (input)="code.set($any($event.target).value)"
      />
    </div>

    <div class="field">
      <label for="reset-password-new-password">Nouveau mot de passe</label>
      <input
        id="reset-password-new-password"
        name="newPassword"
        type="password"
        autocomplete="new-password"
        required
        minlength="8"
        [value]="newPassword()"
        (input)="newPassword.set($any($event.target).value)"
      />
    </div>

    @if (error()) {
      <p class="field-error" role="alert">{{ error() }}</p>
    }

    <button type="submit" class="submit" [disabled]="submitting()">
      {{ submitting() ? 'Réinitialisation…' : 'Réinitialiser le mot de passe' }}
    </button>
  </form>

  <p class="login-link"><a routerLink="/login">Retour à la connexion</a></p>
</main>

<app-site-footer />
